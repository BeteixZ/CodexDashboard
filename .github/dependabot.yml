version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: nuget
    directories:
      - /
      - /src/Assistant.Core
      - /src/Assistant.Windows
      - /src/Codex.Control
      - /src/Codex.Migration
      - /src/Codex.Protocol
      - /src/Codex.ReadOnly
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
