name: Windows quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  isolated-tests:
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run isolated checks
        run: ./scripts/Test-Project.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'project-checks')
      - name: Retain isolated results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-evidence
          path: |
            ${{ runner.temp }}/project-checks/summary.json
            ${{ runner.temp }}/project-checks/*.log
            ${{ runner.temp }}/project-checks/**/checks.json
            ${{ runner.temp }}/project-checks/readonly/readonly-checks.json
          if-no-files-found: warn
          retention-days: 14
